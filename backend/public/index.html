<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paso · Administración</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><main><header><h1>Paso · Administración</h1><p>Control global de las instalaciones conectadas.</p></header><section id="login"><form id="loginform"><label for="password">Contraseña de administración</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button>Entrar</button></form></section><section id="panel" hidden><div class="top"><strong id="status"></strong><button id="logout" type="button">Cerrar sesión</button></div><form id="controlform"><h2>Disponibilidad de la app</h2><label class="check"><input id="enabled" type="checkbox"> App habilitada</label><label for="blockedMessage">Mensaje de bloqueo</label><textarea id="blockedMessage" maxlength="1000" required rows="3"></textarea><button>Guardar disponibilidad</button></form><form id="messageform"><h2>Aviso dentro de la app</h2><label for="announcement">Mensaje</label><textarea id="announcement" maxlength="2000" rows="4" required></textarea><div class="buttons"><button>Enviar aviso</button><button type="button" id="remove">Retirar aviso</button></div><p id="current"></p></form><button id="refresh" type="button">Recargar estado</button><p class="hint">Los cambios afectan a todas las instalaciones. Los avisos llegan con la app abierta y conectada o al volver a abrirla. No son notificaciones push.</p></section><p id="feedback" role="status" aria-live="polite"></p></main></body></html>
