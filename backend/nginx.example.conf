# Dentro de un server HTTPS con tu dominio y certificado configurados.
# El backend debe tener PUBLIC_ORIGIN=https://ese-mismo-dominio
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 65s;
}
